<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Vanilla JS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Panel de tareas (Vanilla JS)</h1>
          <p>
            Conectado como:
            <strong id="currentUser" style="color: #2563eb"></strong>
          </p>
        </div>
        <button
          id="logoutBtn"
          style="
            width: auto;
            background-color: #ef4444;
            padding: 8px 15px;
            font-size: 0.85rem;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
        >
          Cerrar Sesion
        </button>
      </header>
      <form id="taskForm">
        <input
          type="text"
          id="taskTitle"
          placeholder="¿Que necesitas hacer?"
          required
        />
      </form>
    </div>
  </body>
</html>
