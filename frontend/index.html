<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Vanilla JS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Panel de tareas (Vanilla JS)</h1>
          <p>
            Conectado como:
            <strong id="currentUser" style="color: #2563eb"></strong>
          </p>
        </div>
        <button
          id="logoutBtn"
          style="
            width: auto;
            background-color: #ef4444;
            padding: 8px 15px;
            font-size: 0.85rem;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
        >
          Cerrar Sesion
        </button>
      </header>
      <form id="taskForm">
        <input
          type="text"
          id="taskTitle"
          placeholder="¿Que necesitas hacer?"
          required
        />
        <textarea id="taskDescription" placeholder="Que necesitas hacer?" required>

        </textarea>
        <button type="submit">
            Agregar Tarea 
        </button>
      </form>
      <main>
        <h2>Tus Tareas</h2>
        <div id="taskContainer"></div>
      </main>
    </div>

    <div id="customModal" class="modal-ovarlay">
        <div class="modal-box">
           <h3 id="modalTitle">Mensaje del Sistema</h3>
           <p id="modalMessage">Aqui va el texto explicativo</p>
           <div>
            <button id="modalCancelBtn" class="btn-secondary">
               Cancelar
            </button>
            <button id="modalConfirmBtn" class="btn-primay">
               Aceptar
            </button>
           </div>
        </div>
    </div>

   <div id="loginModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Identificacion de Autor</h3>
        <p>Por favor, ingresa tu nombre para comenzar a gestionar tus tareas:</p>
        <form id="loginForm" style="box-shadow: none; padding: 0;" margin: 0; display: flex; flex-direction: column; gap: 10px;>
            <input type="text" id="loginInput" placeholder="Ej. Dhaniel, Ana..." required>
            <div class="modal-buttons">
                  <button type="submit" class="btn-primary">Ingresar al Panel</button>
            </div>
        </form>
    </div>
   </div>


   <script src="app.js"></script>
  </body>
</html>
